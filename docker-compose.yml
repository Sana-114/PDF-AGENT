name: pdfagent

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdfagent
      POSTGRES_USER: pdfagent
      POSTGRES_PASSWORD: pdfagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfagent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pdfagent
      MINIO_ROOT_PASSWORD: change-me-in-production
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  bge-embedding:
    profiles: ["local-bge"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    command:
      - --model-id
      - ${BGE_EMBEDDING_MODEL:-BAAI/bge-m3}
      - --auto-truncate
      - --max-client-batch-size
      - ${TEI_MAX_CLIENT_BATCH_SIZE:-32}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      RAYON_NUM_THREADS: ${TEI_CPU_THREADS:-8}
    volumes:
      - bge_embedding_cache:/data
    ports:
      - "${BGE_EMBEDDING_PORT:-8001}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/info"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 10m
    restart: unless-stopped

  bge-reranker:
    profiles: ["local-bge"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    command:
      - --model-id
      - ${BGE_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - --auto-truncate
      - --max-client-batch-size
      - ${TEI_MAX_CLIENT_BATCH_SIZE:-32}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      RAYON_NUM_THREADS: ${TEI_CPU_THREADS:-8}
    volumes:
      - bge_reranker_cache:/data
    ports:
      - "${BGE_RERANKER_PORT:-8002}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/info"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 10m
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://pdfagent:pdfagent@postgres:5432/pdfagent
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      VECTOR_SEARCH_ENABLED: ${VECTOR_SEARCH_ENABLED:-true}
      VECTOR_COLLECTION: ${VECTOR_COLLECTION:-paperpilot_chunks_v1}
      VECTOR_PREFETCH_K: ${VECTOR_PREFETCH_K:-24}
      VECTOR_TIMEOUT_SECONDS: ${VECTOR_TIMEOUT_SECONDS:-3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-ngram-v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8001/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-60}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-none}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-http://host.docker.internal:8002/v1}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-60}
      RERANKER_CANDIDATE_K: ${RERANKER_CANDIDATE_K:-12}
      RERANKER_RETRIEVAL_WEIGHT: ${RERANKER_RETRIEVAL_WEIGHT:-0.25}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      PARSED_DIR: /app/data/parsed
      TRANSLATION_DIR: /app/data/translations
      MAX_CSV_MB: ${MAX_CSV_MB:-10}
      CELERY_TASK_ALWAYS_EAGER: "false"
      PARSE_BATCH_PAGES: ${PARSE_BATCH_PAGES:-25}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-chi_sim+eng}
      OCR_DPI: ${OCR_DPI:-300}
      OCR_MIN_TEXT_CHARS: ${OCR_MIN_TEXT_CHARS:-32}
      OCR_TESSDATA: ${OCR_TESSDATA:-/usr/share/tesseract-ocr/5/tessdata}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.18}
      SCHOLARLY_API_TIMEOUT_SECONDS: ${SCHOLARLY_API_TIMEOUT_SECONDS:-20}
      SEMANTIC_SCHOLAR_BASE_URL: ${SEMANTIC_SCHOLAR_BASE_URL:-https://api.semanticscholar.org/graph/v1}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      ARXIV_API_BASE_URL: ${ARXIV_API_BASE_URL:-https://export.arxiv.org/api}
      CROSSREF_BASE_URL: ${CROSSREF_BASE_URL:-https://api.crossref.org}
      SCHOLARLY_CONTACT_EMAIL: ${SCHOLARLY_CONTACT_EMAIL:-}
      SCHOLARLY_PDF_HOSTS: ${SCHOLARLY_PDF_HOSTS:-arxiv.org,export.arxiv.org,pdfs.semanticscholar.org}
      REFERENCE_DISCOVERY_CONCURRENCY: ${REFERENCE_DISCOVERY_CONCURRENCY:-2}
      REFERENCE_MATCH_THRESHOLD: ${REFERENCE_MATCH_THRESHOLD:-0.55}
      ARXIV_REFRESH_INTERVAL_MINUTES: ${ARXIV_REFRESH_INTERVAL_MINUTES:-360}
      ARXIV_REQUEST_DELAY_SECONDS: ${ARXIV_REQUEST_DELAY_SECONDS:-3}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2026-03-10}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CODE_SEARCH_ENABLED: ${GITHUB_CODE_SEARCH_ENABLED:-true}
      GITHUB_CODE_LOOKUP_LIMIT: ${GITHUB_CODE_LOOKUP_LIMIT:-3}
    volumes:
      - ./backend:/app
      - app_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://pdfagent:pdfagent@postgres:5432/pdfagent
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      VECTOR_SEARCH_ENABLED: ${VECTOR_SEARCH_ENABLED:-true}
      VECTOR_COLLECTION: ${VECTOR_COLLECTION:-paperpilot_chunks_v1}
      VECTOR_PREFETCH_K: ${VECTOR_PREFETCH_K:-24}
      VECTOR_TIMEOUT_SECONDS: ${VECTOR_TIMEOUT_SECONDS:-3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-ngram-v1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8001/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-60}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-none}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-http://host.docker.internal:8002/v1}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-60}
      RERANKER_CANDIDATE_K: ${RERANKER_CANDIDATE_K:-12}
      RERANKER_RETRIEVAL_WEIGHT: ${RERANKER_RETRIEVAL_WEIGHT:-0.25}
      SCHOLARLY_API_TIMEOUT_SECONDS: ${SCHOLARLY_API_TIMEOUT_SECONDS:-20}
      ARXIV_API_BASE_URL: ${ARXIV_API_BASE_URL:-https://export.arxiv.org/api}
      ARXIV_REFRESH_INTERVAL_MINUTES: ${ARXIV_REFRESH_INTERVAL_MINUTES:-360}
      ARXIV_REQUEST_DELAY_SECONDS: ${ARXIV_REQUEST_DELAY_SECONDS:-3}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2026-03-10}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CODE_SEARCH_ENABLED: ${GITHUB_CODE_SEARCH_ENABLED:-true}
      GITHUB_CODE_LOOKUP_LIMIT: ${GITHUB_CODE_LOOKUP_LIMIT:-3}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      PARSED_DIR: /app/data/parsed
      TRANSLATION_DIR: /app/data/translations
      CELERY_TASK_ALWAYS_EAGER: "false"
      PARSE_BATCH_PAGES: ${PARSE_BATCH_PAGES:-25}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-chi_sim+eng}
      OCR_DPI: ${OCR_DPI:-300}
      OCR_MIN_TEXT_CHARS: ${OCR_MIN_TEXT_CHARS:-32}
      OCR_TESSDATA: ${OCR_TESSDATA:-/usr/share/tesseract-ocr/5/tessdata}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.18}
    volumes:
      - ./backend:/app
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO --schedule=/app/data/celerybeat-schedule
    environment:
      REDIS_URL: redis://redis:6379/0
      ARXIV_REFRESH_INTERVAL_MINUTES: ${ARXIV_REFRESH_INTERVAL_MINUTES:-360}
    volumes:
      - ./backend:/app
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      target: runner
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  app_data:
  bge_embedding_cache:
  bge_reranker_cache:
