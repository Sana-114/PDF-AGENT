name: pdfagent

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdfagent
      POSTGRES_USER: pdfagent
      POSTGRES_PASSWORD: pdfagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfagent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pdfagent
      MINIO_ROOT_PASSWORD: change-me-in-production
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://pdfagent:pdfagent@postgres:5432/pdfagent
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      PARSED_DIR: /app/data/parsed
      CELERY_TASK_ALWAYS_EAGER: "false"
      FRONTEND_ORIGIN: http://localhost:3000
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+chi_sim}
      OCR_DPI: ${OCR_DPI:-300}
      OCR_MIN_TEXT_CHARS: ${OCR_MIN_TEXT_CHARS:-32}
      OCR_TESSDATA: ${OCR_TESSDATA:-/usr/share/tesseract-ocr/5/tessdata}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.18}
    volumes:
      - ./backend:/app
      - app_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://pdfagent:pdfagent@postgres:5432/pdfagent
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      PARSED_DIR: /app/data/parsed
      CELERY_TASK_ALWAYS_EAGER: "false"
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+chi_sim}
      OCR_DPI: ${OCR_DPI:-300}
      OCR_MIN_TEXT_CHARS: ${OCR_MIN_TEXT_CHARS:-32}
      OCR_TESSDATA: ${OCR_TESSDATA:-/usr/share/tesseract-ocr/5/tessdata}
    volumes:
      - ./backend:/app
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  app_data:
  frontend_node_modules:
