services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
    restart: "no"
    volumes:
      - ./backend:/app
      - app_data:/app/data

  worker:
    environment:
      APP_ENV: development
    restart: "no"
    volumes:
      - ./backend:/app
      - app_data:/app/data

  beat:
    environment:
      APP_ENV: development
    restart: "no"
    volumes:
      - ./backend:/app
      - app_data:/app/data

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: "no"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      disable: true

volumes:
  app_data:
  frontend_node_modules:
